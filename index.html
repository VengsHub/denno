<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sperm Game - DOM Edition</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div id="game-container">
  <img src="assets/sperm.gif" id="player" alt="player">

  <div id="ui-top">
    <div id="hp-counter">HP: <span id="hp-value">3</span></div>
    <div id="score-counter">Score: <span id="score-value">0</span></div>
  </div>

  <div id="game-over-screen" class="hidden">
    <h1>GAME OVER</h1>
    <p>Final Score: <span id="final-score">0</span></p>
    <button id="restart-button">Restart</button>
  </div>
</div>

<script src="script.js" type="module"></script>
</body>
</html>
